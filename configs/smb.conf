# smb.conf — ERP Taller MCA
# Samba server para compartir archivos entre notebook e i3

[global]
   workgroup = TALLER
   server string = ERP Taller MCA Server
   netbios name = PCSERVER

   # Security
   security = user
   map to guest = never
   encrypt passwords = yes
   smb passwd file = /etc/samba/smbpasswd

   # Performance (4GB RAM server)
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   read raw = yes
   write raw = yes
   max xmit = 65535
   dead time = 15

   # Logging
   log file = /var/log/samba/log.%m
   max log size = 5000
   log level = 1

   # Charset
   unix charset = UTF-8
   dos charset = CP1252

# ── Compartido General ──────────────────────────────────────────
[Compartido]
   path = /data/compartido/Compartido
   browseable = yes
   writable = yes
   valid users = @sambagroup
   force group = sambagroup
   create mask = 0664
   directory mask = 2775
   comment = Archivos compartidos del taller

# ── Documentos Taller ───────────────────────────────────────────
[Documentos]
   path = /data/compartido/Documentos
   browseable = yes
   writable = yes
   valid users = @sambagroup
   force group = sambagroup
   create mask = 0664
   directory mask = 2775
   comment = Documentos administrativos del taller

# ── Imagenes ────────────────────────────────────────────────────
[Imagenes]
   path = /data/compartido/Imagenes
   browseable = yes
   writable = yes
   valid users = @sambagroup
   force group = sambagroup
   create mask = 0664
   directory mask = 2775
   comment = Imagenes de vehiculos y DVI

# ── Videos ──────────────────────────────────────────────────────
[Videos]
   path = /data/compartido/Videos
   browseable = yes
   writable = yes
   valid users = @sambagroup
   force group = sambagroup
   create mask = 0664
   directory mask = 2775
   comment = Videos de inspeccion y capacitacion

# ── ERP Storage (solo lectura para clientes) ────────────────────
[ERP-Storage]
   path = /data/erp-storage
   browseable = yes
   writable = no
   valid users = @sambagroup
   comment = Storage del ERP (solo lectura)
