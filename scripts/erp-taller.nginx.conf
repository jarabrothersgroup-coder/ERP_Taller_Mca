# ERP Taller MCA — nginx on-prem
# Sirve /api, /storage, /health al backend (127.0.0.1:3000) y redirige todo a HTTPS.
# El web Next.js se despliega en la nube; en on-prem solo se usa la SPA /dashboard
# (servida por el backend). Este root /data/erp-frontend queda vacío salvo que
# despliegues el web localmente.

# HTTP -> HTTPS (excepto health y ACME para renovación de cert)
server {
    listen 80;
    server_name _;

    location = /health { proxy_pass http://127.0.0.1:3000/health; }
    location /.well-known/ { root /var/www/letsencrypt; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/erp-taller/tls/fullchain.pem;
    ssl_certificate_key /etc/erp-taller/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    location /storage/ {
        alias /data/erp-storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    location / {
        root /data/erp-frontend;
        try_files $uri $uri/ /index.html;
    }
}
