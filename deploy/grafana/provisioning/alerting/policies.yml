apiVersion: 1

# Política de notificación raíz: todas las alertas → ERP Alerts.
# Agrupa por carpeta + nombre de alerta; silencia resolves automáticamente.
policies:
  - orgId: 1
    receiver: ERP Alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - matchers:
          - severity = "critical"
        receiver: ERP Alerts
        continue: true
