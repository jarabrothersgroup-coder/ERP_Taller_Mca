# ─────────────────────────────────────────────────────────
# AutomotiveOS Cloud ERP — Docker Compose (On-Premise)
# ─────────────────────────────────────────────────────────
# Arquitectura 100% local para servidor on-premise:
#   - ERP (Fastify + TypeScript)
#   - PostgreSQL 16 (base de datos local)
#   - Redis (cache)
#   - Storage local (fotos DVI, archivos)
#
# Hardware mínimo: 1GB RAM, 2 CPU cores, 10GB HDD
# Consumo estimado: ~280MB RAM total
#
# Uso:
#   cp .env.example .env    # Configurar variables
#   docker compose -f docker-compose.onpremise.yml up -d
#   docker compose -f docker-compose.onpremise.yml logs -f
#
# URLs después de levantar:
#   ERP:              http://localhost:3000
#   PostgreSQL:       localhost:5432
#   Redis:            localhost:6379
#   Storage:          /data/erp-storage/
# ─────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL 16 (Local Database) ───────────
  # pgvector/pgvector:pg16 — la migración 0000 requiere la extensión `vector`
  # (RAG embeddings), ausente en postgres:16-alpine plano.
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    # Sin container_name: serverctl filtra contenedores por prefijo {project_id}_
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotive_os}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_password}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTA: NO montar docker/postgres/init.sql — crea whatsapp_errors_log y
    # crm_sync_log que la migración 0000 también crea (conflicto en DB fresca).
    # Las 23 migraciones drizzle son la única fuente de verdad del esquema.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-automotive_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # ─── Redis 7 (Cache) ─────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-erp_redis_password}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-erp_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # ─── ERP Backend (Fastify + TypeScript) ───────
  erp:
    build:
      context: .
      dockerfile: Dockerfile
    image: automotiveos/erp-backend:latest
    restart: unless-stopped
    ports:
      # NOTE: hardcoded (not ${PORT:-3000}) — podman-compose 1.6.0 crashes with
      # "sequence item 0: expected str instance, int found" when an integer
      # default is used inside a port mapping during variable interpolation.
      - "3000:3000"
      # 4000: alias de desarrollo — los tests E2E API (e2e/api-*.spec.ts)
      # llaman a http://localhost:4000 directamente.
      - "4000:3000"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_local_password}@postgres:5432/${POSTGRES_DB:-automotive_os}?sslmode=disable
      STORAGE_PATH: /data/erp-storage
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # security-hw requires TOKEN_SECRET (>= 32 chars) or the app refuses to boot
      TOKEN_SECRET: ${TOKEN_SECRET:-change-me-dev-token-secret-32-chars-min}
      TENANT_SCHEMA_PREFIX: ${TENANT_SCHEMA_PREFIX:-tenant_}
      # Per-request tenant context: dedicated connection + app.current_tenant
      # per request (defense-in-depth RLS). Safe with fail-closed RLS (0019).
      ENABLE_REQUEST_TENANT_CONTEXT: ${ENABLE_REQUEST_TENANT_CONTEXT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # WhatsApp / Evolution API (optional)
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://evolution-api:8080}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      # Twenty CRM (optional)
      TWENTY_API_URL: ${TWENTY_API_URL:-http://twenty-crm:3000}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      TWENTY_GRAPHQL_URL: ${TWENTY_GRAPHQL_URL:-http://twenty-crm:3000/graphql}
      # SIFEN
      SIFEN_CERT_PATH: ${SIFEN_CERT_PATH:-}
      SIFEN_CERT_PASS: ${SIFEN_CERT_PASS:-}
      SIFEN_USE_TEST: ${SIFEN_USE_TEST:-true}
      # RAG
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Requeridos por env.ts en producción (billing/email) — vacíos si no se usan
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    healthcheck:
      # /health/live is the public liveness probe; /health requires JWT auth
      # 127.0.0.1 (not localhost): Alpine resolves localhost to ::1 (IPv6) but
      # the app only listens on IPv4 → false connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - erp_storage:/data/erp-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network

  # ─── Web Frontend (Next.js 16) ───────────────
  # Modern dashboard. Proxies /api/*, /workshop/*, etc. to the erp backend
  # via next.config.mjs rewrites (BACKEND_HOST/BACKEND_PORT baked at build).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: automotiveos/erp-web:latest
    restart: unless-stopped
    ports:
      - "3100:3000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_HOST: erp
      BACKEND_PORT: "3000"
    healthcheck:
      # /sign-in responde 200 sin auth (el middleware de auth redirige /health/*
      # a /sign-in sin cookie). El backend tiene su propio healthcheck /health/live.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/sign-in', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      erp:
        condition: service_healthy
    networks:
      - erp-network

  # ─── Grafana (Monitoreo — Opcional) ───────────
  # Dashboards financiero + monitoreo con datasource PostgreSQL (rol de solo
  # lectura grafana_reader, ver scripts/provision-grafana-reader.sh).
  # Activar con: podman-compose -f docker-compose.onpremise.yml --profile observability up -d grafana
  grafana:
    image: docker.io/grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
    environment:
      # Interpolación de provisioning: Grafana expande ${VAR} pero NO soporta
      # default `:-` — ambas vars son obligatorias (ver .env.example).
      PG_GRAFANA_PASSWORD: ${PG_GRAFANA_PASSWORD}
      PG_DATASOURCE_URL: ${PG_DATASOURCE_URL:-postgres:5432}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-erp_grafana_admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Alertas (ver .env.example). ALERT_WEBHOOK_URL con default no vacío:
      # Grafana exige URL en el contact point (provisioning falla si está vacía).
      # En prod configurar el webhook real (Telegram/Teams/Slack).
      # NOTA: los umbrales de las reglas son fijos (rules.yml) — Grafana no
      # expande env vars dentro del modelo de reglas (grafana#54984).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9999/grafana-webhook}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

  # ─── Evolution API (WhatsApp — Opcional) ─────
  # Descomentar si necesitas WhatsApp integration
  # evolution-api:
  #   image: atendai/evolution-api:v2.2.3
  #   container_name: erp-evolution-api
  #   restart: unless-stopped
  #   ports:
  #     - "${EVOLUTION_API_PORT:-8080}:8080"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"
  #   environment:
  #     SERVER_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
  #     AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-}
  #     DATABASE_PROVIDER: postgresql
  #     DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_local_password}@postgres:5432/${EVOLUTION_DB:-evolution_api}?sslmode=disable
  #     S3_ENABLED: "false"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - erp-network

  # ─── Twenty CRM (Opcional) ───────────────────
  # Descomentar si necesitas CRM
  # twenty-crm:
  #   image: twentycrm/twenty:latest
  #   container_name: erp-twenty-crm
  #   restart: unless-stopped
  #   ports:
  #     - "${TWENTY_PORT:-3001}:3000"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"
  #   environment:
  #     PG_DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_local_password}@postgres:5432/${TWENTY_DB:-twenty_crm}?sslmode=disable
  #     SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3001}
  #     ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET:-}
  #     LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET:-}
  #     REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET:-}
  #     FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET:-}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - erp-network

volumes:
  postgres_data:
  redis_data:
  erp_storage:
  grafana_data:

networks:
  erp-network:
    driver: bridge
