name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_test_password
          POSTGRES_DB: automotive_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://erp_user:erp_test_password@localhost:5432/automotive_os_test?sslmode=disable"
      JWT_SECRET: "ci-test-secret-not-for-prod"
      STORAGE_PATH: "/tmp/erp-storage-ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Apply RLS (defense-in-depth)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=erp_test_password psql -h localhost -U erp_user -d automotive_os_test -f scripts/apply-rls.sql

      - name: Seed test data
        run: |
          PGPASSWORD=erp_test_password psql -h localhost -U erp_user -d automotive_os_test -f scripts/seed-test.sql

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
